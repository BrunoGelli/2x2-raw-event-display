[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndlar-raw-display"
version = "0.3.0"
description = "Read-only PACMAN observer and browser-based 2D phosphor display for ND-LAr 2x2"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "pyzmq>=25,<28", "fastapi>=0.100,<1", "uvicorn>=0.23,<1", "websockets>=11,<16"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
raw-display = "raw_display.__main__:main"

[tool.setuptools.package-data]
raw_display = ["static/*"]

[tool.setuptools.packages.find]
include = ["raw_display*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
